<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Eventric Events logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="45%" stop-color="#c8a24c"/>
      <stop offset="100%" stop-color="#9a7222"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e2744"/>
      <stop offset="100%" stop-color="#5e1630"/>
    </linearGradient>
  </defs>

  <!-- emblem disc -->
  <circle cx="32" cy="32" r="29.5" fill="url(#wine)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="24.6" fill="none" stroke="url(#gold)" stroke-width="0.9" opacity="0.55"/>

  <!-- stylised letter E -->
  <g fill="url(#gold)">
    <rect x="20" y="18" width="5.4" height="28" rx="2.7"/>
    <rect x="20" y="18" width="21" height="5.4" rx="2.7"/>
    <rect x="20" y="29.3" width="15.5" height="5.4" rx="2.7"/>
    <rect x="20" y="40.6" width="21" height="5.4" rx="2.7"/>
  </g>

  <!-- sparkle -->
  <path d="M46.4 12.6 L48 17.6 L53 19.2 L48 20.8 L46.4 25.8 L44.8 20.8 L39.8 19.2 L44.8 17.6 Z"
        fill="url(#gold)"/>
  <!-- small dots -->
  <circle cx="46.8" cy="42.4" r="1.7" fill="url(#gold)" opacity="0.9"/>
  <circle cx="43" cy="47.6" r="1.1" fill="url(#gold)" opacity="0.7"/>
</svg>
